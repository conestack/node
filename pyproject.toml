[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "node"
version = "2.2.0.dev0"
description = "Building data structures as node trees"
dynamic = ["readme"]
requires-python = ">=3.10"
license = {text = "Simplified BSD"}
authors = [{name = "Node Contributors", email = "dev@conestack.org"}]
keywords = ["node", "tree", "fullmapping", "dict"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "odict>=1.9.0",
    "plumber>=1.5",
    "zope.component",
    "zope.deferredimport",
    "zope.deprecation",
    "zope.lifecycleevent",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "http://github.com/conestack/node"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/x-rst"
fragments = [
    {path = "README.rst"},
    {text = "\n\n"},
    {path = "CHANGES.rst"},
    {text = "\n\n"},
    {path = "LICENSE.rst"},
]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github/",
    "/Makefile",
    "/mx.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["src/node"]

[tool.pytest.ini_options]
consider_namespace_packages = true
addopts = ["--import-mode=importlib"]
pythonpath = "src"

[tool.coverage.run]
omit = ["*/node/testing/profiling.py"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# UP008: zero-argument ``super()`` breaks on ``@plumbing`` decorated classes.
# UP031: ``%`` formatting is kept.
ignore = ["UP008", "UP031"]

[tool.ruff.lint.isort]
force-single-line = true
from-first = true
no-sections = true
lines-after-imports = 2
order-by-type = false

[tool.ruff.format]
quote-style = "single"

[tool.zest-releaser]
create-wheel = true
